[project]
name = "delta-cards"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "curl-cffi>=0.16.3",
    "fuzzywuzzy>=0.18.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=13.7.0",
    "sqlmodel>=0.0.42",
    "tcgdex-sdk>=2.3.0",
    "wallapy>=0.6.6",
    "huggingface-hub>=0.20.0",
    "instructor>=1.0.0",
    "llama-cpp-python>=0.2.80",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    "torch",
    "torchvision",
    "ultralytics>=8.0.0",
    "langdetect>=1.0.9",
    "onnxruntime>=1.30.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
delta-cards = "delta_cards:main"
delta-cards-scrape = "delta_cards:main_scrape"
delta-cards-assign = "delta_cards:main_assign"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
torch-backend = "cpu"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
llama-cpp-python = [
    { index = "llama-cpp-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true


[project]
name = "delta-cards"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fuzzywuzzy>=0.18.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sqlmodel>=0.0.42",
    "tcgdex-sdk>=2.3.0",
    "wallapy>=0.6.6",
]

[project.scripts]
delta-cards = "delta_cards:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
